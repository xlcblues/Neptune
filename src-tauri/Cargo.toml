[package]
name = "neptune"
version = "0.5.1"
description = "Neptune local music player"
authors = ["Neptune"]
edition = "2021"

[lib]
name = "neptune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
notify = "8"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
